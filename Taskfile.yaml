version: '3.45.5'

env:
  MINICOM: "-D /dev/ttyACM0 -b 115200 --ansi --term=ansi"

vars:
  BOARD: rpi_pico2/rp2350a/m33/w
  EXTRA_CONF: "--extra-conf local.conf --extra-conf git-commit.conf"
  COMMIT_HASH:
    sh: git rev-parse --short HEAD

tasks:
  git-commit:
    cmd: echo 'CONFIG_GIT_COMMIT="{{.COMMIT_HASH}}"' > git-commit.conf

  build:
    deps: [git-commit]
    cmd: west build -p auto -b {{.BOARD}} {{.EXTRA_CONF}} .

  build-always:
    deps: [git-commit]
    cmd: west build -p always -b {{.BOARD}} {{.EXTRA_CONF}} .

  flash:
    cmd: west flash -r uf2

  console:
    cmd: minicom
